name: 功能建议
description: 提出一个新想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **提交前请先确认**：本项目坚持零第三方依赖、无构建步骤、纯前端离线可用。
        需要引入 npm 包、CDN 脚本或后端服务的建议通常不会被采纳 —— 但如果能用
        浏览器原生 API 手写实现，欢迎讨论。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述实际遇到的场景，而不是直接描述方案
      placeholder: 我经常需要处理 xxx 格式的数据，现在必须先手动 ...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 兼容性确认
      options:
        - label: 这个功能不需要引入第三方库或构建步骤
        - label: 这个功能不需要后端服务，数据仍然留在本地
