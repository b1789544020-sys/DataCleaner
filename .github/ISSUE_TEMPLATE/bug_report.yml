name: Bug 反馈
description: 报告一个问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 你期望发生什么，实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 点击「加载示例」
        2. 勾选「日期标准化」
        3. 点击「执行清洗」
        4. 看到 ...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      description: Excel 导入导出依赖较新的浏览器 API，这项信息很关键
      placeholder: 例如 Chrome 120 / Firefox 121 / Safari 17
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: 使用的 Provider
      options:
        - 启发式（无 API）
        - DeepSeek
        - 通义千问
        - OpenAI
        - 自定义端点
        - WebLLM（本地）
        - 与 AI 无关
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 浏览器控制台报错
      description: 按 F12 打开控制台，把红色报错粘贴到这里
      render: text

  - type: textarea
    id: sample
    attributes:
      label: 最小可复现数据（可选）
      description: |
        如果和特定文件格式有关，请提供一个尽量小的样例。
        ⚠️ 请务必先删除真实的姓名、手机号、身份证等敏感信息。
      render: csv
